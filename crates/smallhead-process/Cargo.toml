[package]
name        = "smallhead-process"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true
repository.workspace  = true
homepage.workspace    = true
documentation.workspace = true
keywords.workspace    = true
categories.workspace  = true
readme      = "README.md"
description = "Managed OS process lifecycle for small-head (S1a Phase 2). ProcessManager + Executor driving spawn/wait/cancel."

[dependencies]
# Workspace deps (see /Cargo.toml). Pinned via workspace to keep versions consistent.
# Phase 2 needs the runtime features for the executor: process spawn, async I/O on
# pipes, select!, Notify, sleep. Full features keep the surface stable while we add
# the S2b persistence layer; trim later once the feature floor settles.
tokio         = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
serde         = { workspace = true }
serde_json    = { workspace = true }
uuid          = { workspace = true }
thiserror     = { workspace = true }
chrono        = { workspace = true }
parking_lot   = { workspace = true }
tracing       = { workspace = true }
fs4           = { workspace = true }
reqwest       = { workspace = true }
smallhead-permission = { path = "../smallhead-permission" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile      = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
# `start` / `wait_for` exercise tokio runtime + Notify; tests need macros + rt.
tokio         = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread", "time"] }
