[package]
name        = "smallhead-ecs"
version     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
homepage    = { workspace = true }
documentation = { workspace = true }
keywords    = { workspace = true }
categories  = { workspace = true }
readme      = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
description = "ECS kernel for smallhead agent — vendored bevy_ecs + WorldOp API + checkpoint store"

[dependencies]
# Vendored bevy_ecs from big-head. Path is relative to small-head/crates/smallhead-ecs:
#   ../../.. → small-head/
#   ../big-head → big-head/
#   /vendor/bevy_ecs → vendor/bevy_ecs
bevy_ecs        = { path = "../../../big-head/vendor/bevy_ecs" }

# Workspace-shared deps
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true }
async-trait     = { workspace = true }
thiserror       = { workspace = true }
anyhow          = { workspace = true }
uuid            = { workspace = true }
sha2            = { workspace = true }
chrono          = { workspace = true }
parking_lot     = { workspace = true }

[dev-dependencies]
tempfile        = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

[lints]
workspace = true